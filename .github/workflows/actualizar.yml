name: Actualizar datos

# Corre todos los días a las 18:45 de Argentina (21:45 UTC), después de que el
# INDEC publica (16 h). También se puede correr a mano desde la pestaña Actions,
# y corre sola cuando se cambian los scripts o las fuentes.
on:
  schedule:
    - cron: "45 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fuentes/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Serie histórica por gobierno (Mirada larga)
        # si falla, la página queda con sus últimos datos y universidades usa la serie anterior
        continue-on-error: true
        run: python scripts/historia.py

      - name: Universidades y Ley 27.795
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/universidades.py

      - name: Guardar cambios (solo si hay datos nuevos)
        run: |
          git config user.name  "analisis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
            git push
          fi
